[project]
name = "creative-governance-sim"
version = "0.1.0"
description = "Experiment machine for LLM 'regents' (controllers) of complex systems; economic governance as domain #1."
authors = [{ name = "Hamyrappy", email = "k.v.t10@mail.ru" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "matplotlib>=3.10.5",
    "pydantic>=2.11.7",
    "restrictedpython>=8.0",
    "python-dotenv>=1.1.1",
    # LLM engine: OpenAI-*compatible* endpoint (any provider/local/proxy via base_url + model).
    "openai>=1.50",
]

# NOTE (migration, see agents/09-grand-plan.md):
#  - migrated from Poetry to uv.
#  - removed the Gemini/LangChain stack (google-generativeai, langchain,
#    langchain-google-genai, google-api-core) — replaced by govsim.core.llm.
#  - removed `mesa` (was declared but never imported).

[project.scripts]
govsim = "govsim.__main__:main"
# NOTE: the legacy `simulation` / `visualize-linear` entry points were removed — they drove the
# DEPRECATED config-driven path (govsim/simulation.py), shipping broken/degenerate commands next to
# the real `govsim` CLI. The modules still import (removal deferred to Phase 4); run them via
# `python -m govsim.simulation` if needed until then.

[dependency-groups]
dev = ["pytest>=8.4.1"]
# Heavy notebook tooling is opt-in (`uv sync --group notebook`) so test/CI sync stays light.
notebook = ["ipykernel>=6.30.1", "jupyterlab>=4.4.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["govsim"]
