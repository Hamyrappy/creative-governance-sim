[tool.poetry]
name = "creative-governance-sim"
version = "0.1.0"
description = "Simulating creative government policy generation in agent-based economic models using LLMs."
authors = ["Hamyrappy <k.v.t10@mail.ru>"]
license = "MIT"
readme = "README.md"

packages = [{include = "govsim"}]

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.3.1"
numpy = "^2.3.2"
matplotlib = "^3.10.5"
google-generativeai = "^0.8.5"
langchain = "^0.3.27"
langchain-google-genai = "<2.1.8"
google-api-core = "^2.25.1"
python-dotenv = "^1.1.1"
mesa = "^3.2.0"
pydantic = "^2.11.7"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
ipykernel = "^6.30.1"
jupyterlab = "^4.4.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
visualize-linear = "govsim.chart_generators.visualize_linear_system:main"
simulation = "govsim.simulation:run_simulation"