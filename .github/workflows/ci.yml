name: CI

# The executable backing for the "green deterministic CI (no API key)" claim in the gate docs.
# Runs the key-free test suite on every push/PR; no secrets are used (replay/scripted only).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (key-free; no notebook group)
        run: uv sync

      - name: Run the test suite (must stay green without an API key)
        run: uv run pytest -q
